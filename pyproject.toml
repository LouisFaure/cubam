[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "cubam"
description = "Read BAM files on the GPU, as columns"
readme = "README.md"
keywords = [ "BAM", "BGZF", "GPU", "RAPIDS", "single-cell" ]
license = "BSD-3-Clause"
authors = [ { name = "Louis Faure" } ]
requires-python = ">=3.11"
classifiers = [
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = [ "version" ]
dependencies = [
  "numpy>=2",
  "pandas>=2.3",
]
scripts.cubam-cellsnp = "cubam.cellsnp_cli:main"
# cuDF (group-by, strings) and RMM come with RAPIDS. nvCOMP inflates BGZF
# blocks through its C library (libnvcomp), which libcudf pins too.
optional-dependencies.rapids-cu12 = [
  "cudf-cu12>=26.2",
  "cupy-cuda12x[ctk]>=14",
  "nvidia-libnvcomp-cu12>=5.1",
]

[dependency-groups]
dev = [ "ruff>=0.17" ]
test = [ "pytest>=9" ]

[tool.hatch]
version.source = "vcs"
version.fallback-version = "0.0.0"

[tool.uv]
default-groups = [ "dev", "test" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
lint.select = [ "B", "E", "F", "I", "UP", "W", "BLE", "SIM" ]

[tool.pytest]
testpaths = [ "tests" ]
addopts = [ "--import-mode=importlib" ]
pythonpath = [ "tests" ]
